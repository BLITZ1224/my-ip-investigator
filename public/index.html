<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-SPACE | Forensic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .scan-line { height: 2px; background: rgba(239, 68, 68, 0.5); position: absolute; width: 100%; top: 0; animation: scan 3s linear infinite; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        #map { height: 350px; border-radius: 15px; border: 1px solid #1e293b; z-index: 1; }
    </style>
</head>
<body class="bg-[#02040a] text-slate-300 min-h-screen p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <div class="relative overflow-hidden bg-[#0d1117] p-8 rounded-3xl border border-slate-800 mb-8 shadow-2xl">
            <div class="scan-line"></div>
            <h1 class="text-4xl font-black text-center text-red-600 tracking-tighter mb-2 uppercase">Forensic Intelligence</h1>
            <p class="text-center text-slate-500 text-[10px] tracking-[0.3em] uppercase">Deep Network & Hardware Monitoring</p>
            
            <div class="mt-8 flex flex-col md:flex-row gap-4 max-w-2xl mx-auto">
                <input type="text" id="ipInput" placeholder="IP လိပ်စာ ထည့်ပါ..." 
                       class="flex-1 bg-[#161b22] border border-slate-700 p-4 rounded-xl focus:outline-none focus:border-red-500 text-white">
                <button onclick="investigate()" id="searchBtn" 
                        class="bg-red-600 hover:bg-red-700 px-10 py-4 rounded-xl font-black text-white transition active:scale-95">
                    စစ်ဆေးမည်
                </button>
            </div>
        </div>

        <div id="main-content" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-[#0d1117] p-4 rounded-3xl border border-slate-800 shadow-xl">
                    <div id="map"></div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-[#0d1117] p-6 rounded-3xl border border-slate-800">
                    <h3 class="text-red-500 font-bold text-xs mb-6 tracking-widest uppercase">Intelligence Data</h3>
                    <div class="space-y-4">
                        <div>
                            <p class="text-[9px] text-slate-500 uppercase">Provider (ISP)</p>
                            <p id="d-isp" class="text-sm font-bold text-white">Loading...</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-slate-500 uppercase">Connection Status</p>
                            <p id="d-status" class="text-sm font-bold">-</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-slate-500 uppercase">Hardware / OS</p>
                            <p id="d-hw" class="text-sm font-bold text-blue-400">-</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-slate-500 uppercase">Battery Level</p>
                            <p id="d-battery" class="text-sm font-bold text-emerald-400">-</p>
                        </div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-800">
                        <p class="text-[9px] text-slate-500 uppercase mb-2">Device HID</p>
                        <code id="d-fp" class="text-[8px] bg-black p-2 rounded block text-red-500 truncate">---</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fpPromise = FingerprintJS.load();
        let map = null;

        async function investigate() {
            const ip = document.getElementById('ipInput').value.trim();
            if(!ip) return alert("IP ထည့်ပါဦး!");

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.innerText = "Scanning...";

            try {
                const response = await fetch(`/api/lookup?ip=${ip}`);
                const data = await response.json();
                
                document.getElementById('main-content').classList.remove('hidden');
                
                // ISP FIX: နေရာစုံကနေ ရှာထားတဲ့ isp_fixed ကို သုံးမယ်
                document.getElementById('d-isp').innerText = data.isp_fixed || "Unknown ISP";
                
                // Security Status
                const isVPN = data.security?.is_vpn;
                const score = data.security?.threat_score || 0;
                const statusNode = document.getElementById('d-status');
                statusNode.innerText = isVPN ? "🚨 VPN DETECTED" : (score < 40 ? "✅ CLEAN" : "⚠️ RISKY");
                statusNode.className = isVPN || score > 40 ? "text-sm font-bold text-red-500 animate-pulse" : "text-sm font-bold text-emerald-400";

                // Device & OS
                const ua = navigator.userAgent;
                const device = /iPhone/.test(ua) ? "iPhone" : (/Android/.test(ua) ? "Android" : "PC");
                document.getElementById('d-hw').innerText = `${device} (${navigator.platform})`;

                // Battery
                if (navigator.getBattery) {
                    const bt = await navigator.getBattery();
                    document.getElementById('d-battery').innerText = `${Math.round(bt.level * 100)}% ${bt.charging ? '⚡' : '🔋'}`;
                }

                // Fingerprint
                const fp = await fpPromise;
                const res = await fp.get();
                document.getElementById('d-fp').innerText = res.visitorId;

                // Map
                if (!map) {
                    map = L.map('map').setView([data.latitude, data.longitude], 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                } else {
                    map.setView([data.latitude, data.longitude], 12);
                }
                L.marker([data.latitude, data.longitude]).addTo(map).bindPopup(data.city).openPopup();

            } catch (e) { alert("Error: " + e.message); }
            finally { btn.disabled = false; btn.innerText = "စစ်ဆေးမည်"; }
        }
    </script>
</body>
</html>
