<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Investigator Pro | Security Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800">
            <h2 class="text-3xl font-black mb-2 text-center text-red-500 tracking-tight">SECURITY DASHBOARD</h2>
            <p class="text-slate-500 text-center mb-8 text-sm">Caching Enabled | Anti-Abuse System</p>
            
            <input type="text" id="ipInput" placeholder="IP လိပ်စာ ရိုက်ထည့်ပါ..." 
                   class="w-full p-4 mb-4 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-red-500 transition text-white placeholder-slate-500">
            
            <button onclick="investigate()" id="searchBtn"
                    class="w-full bg-red-600 hover:bg-red-700 p-4 rounded-lg font-bold transition flex items-center justify-center gap-2">
                <span>စစ်ဆေးမည်</span>
            </button>

            <div id="map" class="w-full h-64 mt-8 rounded-xl border border-slate-700 hidden"></div>
            <div id="result" class="mt-8 hidden space-y-4"></div>
        </div>

        <div class="space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 h-fit">
                <h3 class="text-lg font-bold text-red-500 mb-4">💡 System Status</h3>
                <div id="cache-stats" class="text-xs text-slate-400 space-y-2">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const fpPromise = FingerprintJS.load();
        let map = null;

        async function investigate() {
            const ip = document.getElementById('ipInput').value.trim();
            const resDiv = document.getElementById('result');
            const btn = document.getElementById('searchBtn');
            const mapDiv = document.getElementById('map');

            if(!ip) return alert("IP လိပ်စာ ထည့်ပေးပါဦး သာကြီး!");

            // 1. Caching Check (API ခြွေတာရေး)
            const localCache = localStorage.getItem(`ip_cache_${ip}`);
            if (localCache) {
                console.log("Loading from cache...");
                renderUI(JSON.parse(localCache), true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin">🌀</span> Analyzing...`;
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = "<div class='text-center animate-pulse text-red-400'>Accessing Intelligence Database...</div>";

            try {
                const response = await fetch(`/api/lookup?ip=${ip}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                // API ကရလာတဲ့ Data ကို Cache သိမ်းမယ်
                localStorage.setItem(`ip_cache_${ip}`, JSON.stringify(data));
                
                renderUI(data, false);

            } catch (error) {
                resDiv.innerHTML = `<div class='bg-red-900/50 p-4 rounded text-red-400 text-center border border-red-800'>Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "စစ်ဆေးမည်";
            }
        }

        async function renderUI(data, isCached) {
            const resDiv = document.getElementById('result');
            const mapDiv = document.getElementById('map');
            const fp = await fpPromise;
            const fpResult = await fp.get();
            const visitorId = fpResult.visitorId;

            // Multi-Account Check Logic
            let history = JSON.parse(localStorage.getItem('device_history') || '{}');
            let fraudWarning = "";
            if (history[visitorId] && history[visitorId] !== data.ip_address) {
                fraudWarning = `<div class="bg-orange-900/40 border border-orange-500 p-3 rounded text-orange-200 text-[10px] mb-4">⚠️ SECURITY ALERT: This device was previously seen with IP: ${history[visitorId]}</div>`;
            }
            history[visitorId] = data.ip_address;
            localStorage.setItem('device_history', JSON.stringify(history));

            const riskScore = data.security?.threat_score || 0;
            const isVPN = data.security?.is_vpn;
            const statusColor = (isVPN || riskScore > 40) ? 'border-red-500' : 'border-emerald-500';

            resDiv.classList.remove('hidden');
            resDiv.innerHTML = `
                <div class="border-l-4 ${statusColor} bg-slate-800/50 p-5 rounded-r-lg relative">
                    ${isCached ? '<span class="absolute top-2 right-2 text-[10px] bg-blue-600 px-2 rounded-full text-white">CACHED DATA</span>' : ''}
                    ${fraudWarning}
                    <div class="flex items-center gap-3 mb-4">
                        <img src="https://flagcdn.com/w40/${data.country_code.toLowerCase()}.png" class="w-8 h-6 rounded shadow-sm border border-slate-700">
                        <h3 class="font-bold text-lg text-white">${data.country || "Unknown"} (${data.city || "N/A"})</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                        <div>
                            <p class="text-slate-500">ISP / Organization</p>
                            <p class="text-slate-200 font-medium">${data.connection?.isp_name || "N/A"}</p>
                        </div>
                        <div>
                            <p class="text-slate-500">Connection Type</p>
                            <p class="text-slate-200 font-medium capitalize">${data.connection?.connection_type || "N/A"}</p>
                        </div>
                        <div>
                            <p class="text-slate-500">Risk Score</p>
                            <p class="${riskScore > 40 ? 'text-red-400' : 'text-emerald-400'} font-bold">${riskScore}/100</p>
                        </div>
                        <div>
                            <p class="text-slate-500">Device Fingerprint</p>
                            <code class="text-[10px] bg-slate-900 p-1 rounded">${visitorId}</code>
                        </div>
                    </div>
                    <p class="font-black text-xl mt-6 ${isVPN ? 'text-red-500' : 'text-emerald-500'}">
                        ${isVPN ? 'DETECTED: PROXY/VPN' : 'VERIFIED: CLEAN CONNECTION'}
                    </p>
                </div>
            `;

            // Update Map
            mapDiv.classList.remove('hidden');
            if (!map) {
                map = L.map('map').setView([data.latitude, data.longitude], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            } else {
                map.setView([data.latitude, data.longitude], 12);
            }
            L.marker([data.latitude, data.longitude]).addTo(map)
                .bindPopup(`<b>${data.ip_address}</b><br>${data.city}`).openPopup();
        }
    </script>
</body>
</html>
